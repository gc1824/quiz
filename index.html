<title>安全考试刷题宝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single column app, max 640px, sticky top bar + sticky bottom nav, phone-first */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17212b; --muted:#66727f; --line:#dde3e9;
  --accent:#f2b705; --accent-fg:#1d1700; --brand:#1e3a5f; --brand-fg:#ffffff;
  --ok:#157a46; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5; --sel-bg:#eaf1fa; --sel-line:#1e3a5f;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --fg:#e8edf2; --muted:#93a0ad; --line:#2a3744;
  --accent:#f2b705; --accent-fg:#1d1700; --brand:#8db4e8; --brand-fg:#0c1722;
  --ok:#5fd394; --ok-bg:#12301f; --bad:#ff8c84; --bad-bg:#3a1a18; --sel-bg:#1c2b3d; --sel-line:#8db4e8;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --fg:#e8edf2; --muted:#93a0ad; --line:#2a3744;
  --accent:#f2b705; --accent-fg:#1d1700; --brand:#8db4e8; --brand-fg:#0c1722;
  --ok:#5fd394; --ok-bg:#12301f; --bad:#ff8c84; --bad-bg:#3a1a18; --sel-bg:#1c2b3d; --sel-line:#8db4e8;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:20px 28px}
h1{font-size:28px;line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:18px;margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--brand-fg);border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

/* home */
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.12em}
.brand i{display:block;width:28px;height:10px;background:repeating-linear-gradient(135deg,var(--accent) 0 6px,#1d1700 6px 12px);border-radius:2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--sel-bg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--muted);margin:0;padding-left:1.1em}
.err{color:var(--bad);font-size:14px;margin:0}

/* setup */
.cfg{display:grid;grid-template-columns:1fr auto auto;gap:10px 12px;align-items:center}
.cfg .h{font-size:12px;color:var(--muted)}
.cfg input[type=number]{width:72px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;text-align:center;font-variant-numeric:tabular-nums}
.cfg .nm b{display:block}.cfg .nm span{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
.top .bar{display:flex;align-items:center;gap:8px}
.top .mid{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.top .mid small{color:var(--muted);font-weight:500}
.ibtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{flex:1;padding-block:8px 16px;display:flex;flex-direction:column;gap:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--brand);color:var(--brand-fg)}
.stem{font-size:18px;line-height:1.7;margin:8px 0 0;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .m{flex:none;font-weight:800;align-self:center}
.opt.sel{border-color:var(--sel-line);background:var(--sel-bg)}
.opt.sel .k{background:var(--sel-line);color:var(--brand-fg);border-color:var(--sel-line)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}.opt.ok .m{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}.opt.bad .m{color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}.fb.neutral{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500}
.fb small{display:block;font-weight:500;opacity:.85}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;resize:vertical}
.ref{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-wrap:anywhere}
.foot{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:10px;border-top:1px solid var(--line)}
.foot .btn{flex:1}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:82dvh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:13px;margin:0;color:var(--muted);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.cell{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.seen{border-color:var(--sel-line);color:var(--sel-line)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* result */
.score{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);border-color:transparent;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.it>button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:12px 14px;min-height:56px}
.it .n{flex:none;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.it .s{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.it.open .s{display:block;-webkit-line-clamp:unset}
.st{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.na{background:var(--bg);color:var(--muted)}
.det{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.det .ln{display:flex;gap:8px;overflow-wrap:anywhere}
.det .ln b{flex:none;color:var(--muted);font-weight:600}
.det .o{color:var(--muted);font-size:14px;margin:0;padding-left:0;list-style:none}
.det .o li.c{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- docx reading (zip + deflate, no libraries) ---------- */
async function readDocxText(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

  const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);

    p+=46+nl+el+cl;
    if(name!=="word/document.xml")continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    let data=u8.subarray(ds,ds+csize);
    if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("当前浏览器版本过低，请使用新版 Chrome / Safari / 微信内置浏览器以外的浏览器");
      const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data=new Uint8Array(await new Response(s).arrayBuffer());
    }
    return xmlToText(dec.decode(data));
  }
  throw new Error("文档中未找到正文内容");
}
function xmlToText(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const out=[];
  for(const p of doc.getElementsByTagName("w:p")){
    let t="";
    const walk=n=>{for(const c of n.childNodes){
      if(c.nodeType!==1)continue;
      const nm=c.nodeName;
      if(nm==="w:t")t+=c.textContent;
      else if(nm==="w:tab")t+=" ";
      else if(nm==="w:br"||nm==="w:cr")t+="\n";
      else if(nm==="w:rPr"||nm==="w:pPr")continue;
      else walk(c);
    }};
    walk(p);out.push(t);
  }
  return out.join("\n");
}

    const blanks=(stem.match(/[（(]\s*[）)]/g)||[]).length;
    // remove answer marks
    for(const f of [...found].reverse())stem=stem.slice(0,f.index)+"（　　）"+stem.slice(f.index+f[0].length);
    if(blanks>0&&/（　　）\s*[。.]?\s*$/.test(stem))stem=stem.replace(/\s*（　　）\s*([。.]?)\s*$/,"$1");
  }
  stem=stem.replace(/[（(]\s*[）)]/g,"（　　）").trim();
  let ans=letters.size?[...letters].sort().join(""):null;
  if(!ans){const am2=/答案\s*[:：]?\s*([A-F]+)/.exec(t);if(am2)ans=am2[1]}
  const keys=opts.map(o=>o.k);
  if(ans&&![...ans].every(x=>keys.includes(x)))ans=null;
  const type=ans&&ans.length>1?"multi":(c.type==="multi"?"multi":"single");
  return {type,stem,opts,ans};
}

/* ---------- loading ---------- */
async function loadFile(f){
  S.err="";S.warn=[];render();
  try{
    let text;
    if(/\.docx$/i.test(f.name))text=await readDocxText(await f.arrayBuffer());
    else if(/\.(txt|md)$/i.test(f.name))text=await f.text();
    else throw new Error("请上传 .docx 格式的 Word 题库");
    const r=parseBank(text);
    if(!r.bank.length)throw new Error("没有识别到题目。请确认题目以“1.”“2.”这样的序号开头，选项以“A.”“B.”标注");
    S.bank=r.bank;S.name=f.name;S.warn=r.warns;S.cfg=null;
    const noAns=r.bank.filter(q=>q.type!=="short"&&!q.ans).length;
    if(noAns)S.warn.push(`${noAns} 道题没有识别到答案，作答后只提示“题库未提供答案”，不计分`);
    S.custom=true;store.set({name:S.name,bank:S.bank,warn:S.warn,custom:true});
    S.view="home";
  }catch(e){S.err=e.message||String(e);}
  render();
}
function counts(){const c={};for(const q of S.bank)c[q.type]=(c[q.type]||0)+1;return c}

/* ---------- exam ---------- */
function defaults(){
  const c=counts(),cfg={mode:"random",types:{}};
  const d={single:[40,2],multi:[10,2],tf:[20,1],short:[3,0]};
  for(const t of ORDER)if(c[t])cfg.types[t]={n:Math.min(d[t][0],c[t]),score:d[t][1]};
  return cfg;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildExam(){
  const items=[];
  for(const t of ORDER){
    const cf=S.cfg.types[t];if(!cf||!cf.n)continue;
    let pool=S.bank.filter(q=>q.type===t);
    pool=S.cfg.mode==="random"?shuffle(pool):pool;
    pool.slice(0,cf.n).sort((a,b)=>S.cfg.mode==="random"?0:a.id-b.id).forEach(q=>items.push({q,sel:"",done:false,ok:null,text:"",score:q.type==="short"||!q.ans?0:cf.score}));
  }
  S.exam={items,start:Date.now()};S.idx=0;S.sheet=false;S.filter="all";S.open=new Set();S.view="quiz";
}
const sameAns=(sel,ans)=>[...sel].sort().join("")===[...ans].sort().join("");
function choose(k){
  const it=S.exam.items[S.idx];if(it.done)return;
  if(it.q.type==="multi"){it.sel=it.sel.includes(k)?it.sel.replace(k,""):[...it.sel,k].sort().join("");render();return}
  it.sel=k;finishItem(it);
}
function finishItem(it){
  if(!it.sel)return;
  it.done=true;it.ok=it.q.ans?sameAns(it.sel,it.q.ans):null;
  render();
  clearTimeout(S.timer);
  const at=S.idx;
  if(at<S.exam.items.length-1)S.timer=setTimeout(()=>{if(S.idx===at&&S.view==="quiz")go(at+1)},it.ok===false?1500:800);
}
function go(i){
  clearTimeout(S.timer);
  S.idx=Math.max(0,Math.min(S.exam.items.length-1,i));
  S.seen.add(S.idx);S.sheet=false;render();window.scrollTo(0,0);
}
function submit(){
  clearTimeout(S.timer);S.sheet=false;S.view="result";S.filter="all";S.open=new Set();render();window.scrollTo(0,0);
}

/* ---------- views ---------- */
function render(){
  const a=$("#app");
  a.innerHTML=S.view==="home"?vHome():S.view==="setup"?vSetup():S.view==="quiz"?vQuiz():vResult();
  bind();
}
function summary(){
  const c=counts();
  return `<div class="stats">${ORDER.filter(t=>c[t]).map(t=>`<div class="stat"><b>${c[t]}</b><span>${TYPE[t]}</span></div>`).join("")}</div>`;
}

function vSetup(){
  const c=counts();
  let total=0,cnt=0;
  const rows=ORDER.filter(t=>c[t]).map(t=>{
    const cf=S.cfg.types[t];cnt+=cf.n;total+=t==="short"?0:cf.n*cf.score;
    return `<div class="nm"><b>${TYPE[t]}</b><span>题库共 ${c[t]} 道${t==="short"?"，只看答案不评分":""}</span></div>

  }).join("");

   <button class="ibtn" id="toHome" style="align-self:flex-start">← 返回</button>
   <h1>组卷设置</h1>

     <h2>出题方式</h2>
     <div class="seg" role="group" aria-label="出题方式"><button data-mode="random" aria-pressed="${S.cfg.mode==="random"}">随机抽题</button><button data-mode="order" aria-pressed="${S.cfg.mode==="order"}">按题库顺序</button></div>
   </div>
   <div class="card total"><span>共 <b>${cnt}</b> 题</span><span>满分 <b>${total}</b> 分</span></div>
   <button class="btn primary block" id="start" ${cnt?"":"disabled"}>开始考试</button>
  </div>`;
}
function optHTML(it,o){
  const q=it.q,ans=q.ans||"";
  let cls="",mark="";
  if(it.done){
    const isAns=ans.includes(o.k),picked=it.sel.includes(o.k);
    if(isAns){cls="ok";mark="✓"}
    else if(picked){cls="bad";mark="✗"}
  }else if(it.sel.includes(o.k))cls="sel";
  const lab=q.type==="tf"?(o.k==="T"?"√":"×"):o.k;
  return `<button class="opt ${cls}" data-k="${o.k}" ${it.done?"disabled":""} aria-pressed="${it.sel.includes(o.k)}"><span class="k">${lab}</span><span class="t">${esc(o.t)}</span>${mark?`<span class="m" aria-hidden="true">${mark}</span>`:""}</button>`;
}
function ansText(q){
  if(!q.ans)return "";
  return [...q.ans].map(k=>{const o=q.opts.find(x=>x.k===k);return q.type==="tf"?o.t:`${k}. ${o.t}`}).join("；");
}
function vQuiz(){
  const E=S.exam.items,it=E[S.idx],q=it.q,last=S.idx===E.length-1;
  S.seen.add(S.idx);
  let body="";
  if(q.type==="short"){
    body=`<textarea id="mytext" placeholder="可以先在这里写下你的答案（选填）">${esc(it.text)}</textarea>
      ${it.done?`<div class="fb neutral">参考答案（简答题不评分）</div>${q.ref?`<div class="ref">${esc(q.ref)}</div>`:`<div class="fb neutral">题库中没有提供这道题的答案</div>`}`
      :`<button class="btn dark block" id="reveal">查看答案</button>`}`;
  }else{
    body=`<div class="opts">${q.opts.map(o=>optHTML(it,o)).join("")}</div>`;
    if(q.type==="multi"&&!it.done)body+=`<button class="btn dark block" id="confirm" ${it.sel?"":"disabled"}>确认答案</button>`;
    if(it.done){
      if(it.ok===true)body+=`<div class="fb ok" role="status">✓ 回答正确</div>`;
      else if(it.ok===false)body+=`<div class="fb bad" role="status">✗ 回答错误<small>你选的是 ${esc(q.type==="tf"?(it.sel==="T"?"正确":"错误"):it.sel)}，正确答案：${esc(ansText(q))}</small></div>`;
      else body+=`<div class="fb neutral" role="status">题库未提供这道题的答案，本题不计分</div>`;
    }
  }
  const doneN=E.filter(x=>x.done).length;
  return `<div class="top"><div class="bar">
      <button class="ibtn" id="quit">退出</button>
      <div class="mid">${S.idx+1} <small>/ ${E.length}</small></div>
      <button class="ibtn" id="sheetBtn">答题卡</button></div>
      <div class="prog" aria-hidden="true"><i style="width:${doneN/E.length*100}%"></i></div></div>
    <div class="q"><div><span class="tag">${TYPE[q.type]}${q.type==="multi"?" · 可多选":""}${it.score?` · ${it.score}分`:""}</span><p class="stem">${esc(q.stem)}</p></div>${body}</div>
    <div class="foot"><button class="btn" id="prev" ${S.idx===0?"disabled":""}>上一题</button>
      ${last?`<button class="btn primary" id="finish">交卷</button>`:`<button class="btn dark" id="next">下一题</button>`}</div>
    ${S.sheet?vSheet():""}${S.quit?`<div class="mask"><div class="sheet" role="dialog" aria-label="退出考试"><h2>退出本次考试？</h2><p class="sub">已完成 ${doneN} / ${E.length} 题。</p><button class="btn primary block" id="quitCancel">继续答题</button><button class="btn dark block" id="quitSubmit">交卷并查看成绩</button><button class="btn block" id="quitGo">放弃并返回首页</button></div></div>`:""}`;
}
function vSheet(){
  const E=S.exam.items,un=E.filter(x=>!x.done).length;
  const cell=(x,i)=>`<button class="cell ${x.done?(x.ok===true?"ok":x.ok===false?"bad":"seen"):""} ${i===S.idx?"cur":""}" data-go="${i}" aria-label="第${i+1}题">${i+1}</button>`;
  const groups=ORDER.map(t=>{const idx=E.map((x,i)=>x.q.type===t?i:-1).filter(i=>i>=0);
    return idx.length?`<div class="sec"><h3>${TYPE[t]}（${idx.length}）</h3><div class="grid">${idx.map(i=>cell(E[i],i)).join("")}</div></div>`:""}).join("");
  return `<div class="mask" id="mask"><div class="sheet" role="dialog" aria-label="答题卡">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>答题卡</h2><button class="ibtn" id="closeSheet">关闭</button></div>
    <div class="legend"><span>✓ 答对（绿）</span><span>✗ 答错（红）</span><span>已答（蓝框）</span><span>未答（灰）</span></div>
    ${groups}
    <p class="sub">${un?`还有 ${un} 题未完成，交卷后按未答处理。`:"全部题目已完成。"}</p>
    <button class="btn primary block" id="submit">交卷</button></div></div>`;
}
function stat(){
  const E=S.exam.items;let got=0,total=0,ok=0,bad=0,un=0,na=0,sh=0,shAll=0;
  for(const x of E){
    if(x.q.type==="short"){shAll++;if(x.done)sh++;continue}
    if(!x.q.ans){na++;continue}
    total+=x.score;
    if(!x.done)un++;else if(x.ok){ok++;got+=x.score}else bad++;
  }
  return {got,total,ok,bad,un,na,sh,shAll};
}
function vResult(){
  const s=stat(),E=S.exam.items;
  const pct=s.total?s.got/s.total:0,R=56,C=2*Math.PI*R;
  const status=x=>x.q.type==="short"?(x.done?"na-seen":"na-un"):!x.q.ans?"na-ans":!x.done?"un":x.ok?"ok":"bad";
  const f=S.filter;
  const show=E.map((x,i)=>[x,i]).filter(([x])=>{const st=status(x);return f==="all"||(f==="bad"&&st==="bad")||(f==="un"&&(st==="un"||st==="na-un"))});
  const label={ok:["ok","答对"],bad:["bad","答错"],un:["na","未答"],"na-ans":["na","无答案"],"na-seen":["na","已看答案"],"na-un":["na","未看答案"]};
  const dur=Math.max(1,Math.round((Date.now()-S.exam.start)/60000));
  const items=show.map(([x,i])=>{
    const st=status(x),q=x.q,open=S.open.has(i),lb=label[st];
    let det="";
    if(open){
      if(q.type==="short")det=`<div class="ln"><b>你的答案</b><span>${esc(x.text)||"（未填写）"}</span></div><div class="ln"><b>参考答案</b><span style="white-space:pre-wrap">${esc(q.ref)||"题库未提供"}</span></div>`;
      else{
        det=`<ul class="o">${q.opts.map(o=>`<li class="${q.ans&&q.ans.includes(o.k)?"c":""}">${q.type==="tf"?"":o.k+". "}${esc(o.t)}${q.ans&&q.ans.includes(o.k)?"　✓":""}</li>`).join("")}</ul>
        <div class="ln"><b>你的答案</b><span>${x.sel?esc(q.type==="tf"?(x.sel==="T"?"正确":"错误"):x.sel):"未作答"}</span></div>
        <div class="ln"><b>正确答案</b><span>${q.ans?esc(q.type==="tf"?ansText(q):q.ans):"题库未提供"}</span></div>`;
      }
    }
    return `<div class="it ${open?"open":""}"><button data-open="${i}" aria-expanded="${open}"><span class="n">${i+1}</span><span class="s">${esc(q.stem)}</span><span class="st ${lb[0]}">${lb[1]}${x.score&&st!=="un"?` ${st==="ok"?"+"+x.score:"0"}`:""}</span></button>${open?`<div class="det">${det}</div>`:""}</div>`;
  }).join("");
  return `<div class="stack">
    <div class="brand"><i></i>本次模考成绩</div>
    <div class="card score">
      <div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="${pct>=.6?"var(--ok)":"var(--bad)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
        <div class="c"><b>${+s.got.toFixed(1)}</b><span>/ ${s.total} 分</span></div></div>
      <div style="min-width:0"><h2>${s.total?(pct>=.9?"成绩优秀":pct>=.6?"成绩合格":"还需加强"):"本卷无可计分题"}</h2>
      <p class="sub">正确率 ${Math.round(pct*100)}% · 用时约 ${dur} 分钟</p></div>
    </div>
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${s.ok}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${s.bad}</b><span>答错</span></div>
      <div class="stat"><b>${s.un}</b><span>未答</span></div>
      ${s.shAll?`<div class="stat"><b>${s.sh}/${s.shAll}</b><span>简答已看（不评分）</span></div>`:""}
    </div>
    <div class="chips" role="group" aria-label="筛选">
      <button class="chip" data-f="all" aria-pressed="${f==="all"}">全部 ${E.length}</button>
      <button class="chip" data-f="bad" aria-pressed="${f==="bad"}">只看错题 ${s.bad}</button>
      <button class="chip" data-f="un" aria-pressed="${f==="un"}">未答 ${s.un+(s.shAll-s.sh)}</button></div>
    <div class="list">${items||`<p class="sub">这里没有题目。</p>`}</div>
    <div class="row"><button class="btn primary" id="again">再来一套</button><button class="btn" id="toSetup">调整设置</button><button class="btn" id="toHome">返回首页</button></div>
  </div>`;
}

/* ---------- events ---------- */
function bind(){
  const on=(s,fn)=>{const e=$(s);if(e)e.addEventListener("click",fn)};
  const file=$("#file");
  if(file)file.addEventListener("change",()=>{if(file.files[0])loadFile(file.files[0])});
  const drop=$("#drop");
  if(drop){
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
  }
  on("#toSetup",()=>{if(!S.cfg||S.view==="home")S.cfg=S.cfg||defaults();S.view="setup";render()});
  on("#resetBank",()=>{useBuiltin();S.cfg=null;S.err="";render()});
  on("#toHome",()=>{S.view="home";render()});
  on("#start",()=>{buildExam();S.seen=new Set([0]);render();window.scrollTo(0,0)});
  on("#again",()=>{buildExam();S.seen=new Set([0]);render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-n]").forEach(i=>i.addEventListener("change",()=>{
    const t=i.dataset.n,max=counts()[t];S.cfg.types[t].n=Math.max(0,Math.min(max,Math.floor(+i.value||0)));render()}));
  document.querySelectorAll("[data-s]").forEach(i=>i.addEventListener("change",()=>{
    S.cfg.types[i.dataset.s].score=Math.max(0,+i.value||0);render()}));
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.cfg.mode=b.dataset.mode;render()}));
  // quiz
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.k)));
  on("#confirm",()=>finishItem(S.exam.items[S.idx]));
  on("#reveal",()=>{const it=S.exam.items[S.idx];it.done=true;render()});
  const ta=$("#mytext");if(ta)ta.addEventListener("input",()=>{S.exam.items[S.idx].text=ta.value});
  on("#prev",()=>go(S.idx-1));on("#next",()=>go(S.idx+1));
  on("#finish",()=>{S.sheet=true;render()});
  on("#sheetBtn",()=>{clearTimeout(S.timer);S.sheet=true;render()});
  on("#closeSheet",()=>{S.sheet=false;render()});
  const mask=$("#mask");if(mask)mask.addEventListener("click",e=>{if(e.target===mask){S.sheet=false;render()}});
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
  on("#submit",submit);
  on("#quit",()=>{clearTimeout(S.timer);S.quit=true;render();});
  on("#quitCancel",()=>{S.quit=false;render()});
  on("#quitSubmit",()=>{S.quit=false;submit()});
  on("#quitGo",()=>{S.quit=false;S.view="home";render()});
  // result
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.f;render()}));
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.open;S.open.has(i)?S.open.delete(i):S.open.add(i);render()}));
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||S.sheet||/TEXTAREA|INPUT/.test(e.target.tagName))return;
  if(e.key==="ArrowRight")go(S.idx+1);else if(e.key==="ArrowLeft")go(S.idx-1);
  else{const k=e.key.toUpperCase();const it=S.exam.items[S.idx];
    if(it.q.type==="tf"){if(k==="1"||k==="Y")choose("T");if(k==="2"||k==="N")choose("F")}
    else if(it.q.opts.some(o=>o.k===k))choose(k);
    else if(e.key==="Enter"&&it.q.type==="multi"&&it.sel&&!it.done)finishItem(it)}
});
(function init(){
  const s=store.get();
  if(s&&s.custom&&Array.isArray(s.bank)&&s.bank.length){S.bank=s.bank;S.name=s.name||"我上传的题库";S.warn=s.warn||[];S.custom=true}
  else useBuiltin();
