<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>安全考试刷题宝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: mini-program shell. Fixed nav bar on top, fixed action bar at bottom, content scrolls in between. Text scales with --z (in-app font size). */
:root{
  --z:1.2;
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17212b; --muted:#66727f; --line:#dde3e9;
  --accent:#f2b705; --accent-fg:#1d1700; --brand:#1e3a5f; --brand-fg:#ffffff;
  --ok:#157a46; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5; --sel-bg:#eaf1fa; --sel-line:#1e3a5f;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --fg:#e8edf2; --muted:#93a0ad; --line:#2a3744;
  --brand:#8db4e8; --brand-fg:#0c1722;
  --ok:#5fd394; --ok-bg:#12301f; --bad:#ff8c84; --bad-bg:#3a1a18; --sel-bg:#1c2b3d; --sel-line:#8db4e8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --fg:#e8edf2; --muted:#93a0ad; --line:#2a3744;
  --brand:#8db4e8; --brand-fg:#0c1722;
  --ok:#5fd394; --ok-bg:#12301f; --bad:#ff8c84; --bad-bg:#3a1a18; --sel-bg:#1c2b3d; --sel-line:#8db4e8;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--z));height:100%;-webkit-text-size-adjust:100%}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:54px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
.nav .l,.nav .r{display:flex;gap:4px;min-width:0}.nav .r{justify-content:flex-end}
.nav .t{font-size:17px;font-weight:700;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav .t small{font-weight:500;color:var(--muted)}
.ibtn{min-height:40px;min-width:40px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:600;white-space:nowrap}
.prog{flex:none;height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{display:flex;flex-direction:column;gap:14px;padding-top:16px;padding-bottom:24px}
.foot{flex:none;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.foot .btn{flex:1;padding:0 6px;white-space:nowrap;min-width:0}

h1{font-size:1.6rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
.sub{color:var(--muted);margin:0;font-size:.875rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:3.1rem;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--brand-fg);border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 120px}

.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;letter-spacing:.1em}
.brand i{display:block;width:28px;height:10px;background:repeating-linear-gradient(135deg,var(--accent) 0 6px,#1d1700 6px 12px);border-radius:2px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--sel-bg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.2rem,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.warn{font-size:.8rem;color:var(--muted);margin:0;padding-left:1.1em}
.err{color:var(--bad);font-size:.9rem;margin:0}

.cfg{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.cfg .h{font-size:.75rem;color:var(--muted)}
.cfg input[type=number]{width:4.4rem;min-height:2.8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:1rem}
.cfg .nm b{display:block}.cfg .nm span{font-size:.75rem;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:2.8rem;border:0;background:var(--surface);font-size:1rem}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.05em;padding:2px 9px;border-radius:6px;background:var(--brand);color:var(--brand-fg)}
.stem{font-size:1.15rem;line-height:1.7;margin:10px 0 0;overflow-wrap:anywhere;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:3.4rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);min-width:0;font-size:1rem}
.opt .k{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.875rem;font-weight:700;margin-top:.05rem}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .m{flex:none;font-weight:800;align-self:center}
.opt.sel{border-color:var(--sel-line);background:var(--sel-bg)}
.opt.sel .k{background:var(--sel-line);color:var(--brand-fg);border-color:var(--sel-line)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}.opt.ok .m{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}.opt.bad .m{color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-weight:700;overflow-wrap:anywhere}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}.fb.neutral{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500}
.fb small{display:block;font-weight:500;font-size:.9rem;opacity:.9}
textarea{width:100%;min-height:7rem;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;resize:vertical;font-size:1rem}
.ref{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-wrap:anywhere}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:82%;overflow:auto;border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:.8rem;margin:0;color:var(--muted);letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:8px}
.cell{min-height:3rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.seen{border-color:var(--sel-line);color:var(--sel-line)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}

.score{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:8.4rem;height:8.4rem;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:2.6rem;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);border-color:transparent;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.it>button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:12px 14px;min-height:3.4rem;font-size:1rem}
.it .n{flex:none;min-width:2rem;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.it .s{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.it.open .s{display:block;-webkit-line-clamp:unset}
.st{flex:none;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.na{background:var(--bg);color:var(--muted)}
.det{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.det .ln{display:flex;gap:8px;overflow-wrap:anywhere}
.det .ln b{flex:none;color:var(--muted);font-weight:600}
.det .o{color:var(--muted);margin:0;padding-left:0;list-style:none}
.det .o li.c{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* tiles, history, wrong book */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tile .n{font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .n.warnc{color:var(--bad)}
.tile b{font-size:1rem}
.tile small{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.resume{border-color:var(--accent);background:var(--sel-bg);display:flex;flex-direction:column;gap:10px}
.tm{display:block;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.tm.low{color:var(--bad)}
.nav .t.two{line-height:1.25}
.alarm{font-size:2.4rem;text-align:center;line-height:1}
.sheet h2.c,.sheet p.c{text-align:center}

.plot{position:relative;height:9.5rem;margin-top:1.6rem;display:flex;gap:.45rem;border-bottom:1.5px solid var(--line)}
.plot .g{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.plot .pass{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);z-index:1}
.plot .pass span{position:absolute;right:0;top:-1.45rem;font-size:.7rem;font-weight:700;background:var(--accent);color:var(--accent-fg);padding:0 6px;border-radius:5px;line-height:1.3rem}
.plot .col{position:relative;flex:1;min-width:0}
.plot .b{position:absolute;left:14%;right:14%;bottom:0;border-radius:7px 7px 0 0;background:var(--brand);min-height:3px}
.plot .b.f{background:var(--bad)}
.plot .v{position:absolute;left:-4px;right:-4px;text-align:center;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;padding-bottom:3px}
.plot .col.last .v{font-size:.95rem}
.dates{display:flex;gap:.45rem;margin-top:6px}
.dates span{flex:1;min-width:0;text-align:center;font-size:.64rem;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dates span.last{color:var(--fg);font-weight:700}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:10px}
.lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw{display:flex;gap:10px;align-items:flex-start}
.tw .rk{flex:none;width:1.6rem;height:1.6rem;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:var(--muted);margin-top:2px}
.tw .rk.h{background:var(--bad-bg);color:var(--bad)}
.tw .mid{flex:1;min-width:0}
.tw .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:.9rem}
.tw .tr{height:.5rem;border-radius:4px;background:var(--bg);margin-top:6px;overflow:hidden}
.tw .tr i{display:block;height:100%;border-radius:4px;background:var(--bad)}
.tw .ct{flex:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--bad);font-size:.95rem;margin-top:1px}
.rec{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0;padding-top:0}
.rec .sc{flex:none;width:3.6rem;text-align:center}
.rec .sc b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.rec .sc b.p{color:var(--ok)}.rec .sc b.f{color:var(--bad)}
.rec .sc span{font-size:.7rem;color:var(--muted)}
.rec .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rec .dt{font-size:.9rem;font-weight:600}
.rec .sg{display:flex;height:.55rem;border-radius:4px;overflow:hidden;background:var(--bg)}
.rec .sg i{display:block;height:100%}
.rec .ds{font-size:.75rem;color:var(--muted)}
.dl{flex:none;font-size:.78rem;font-weight:800;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.dl.up{background:var(--ok-bg);color:var(--ok)}.dl.dn{background:var(--bad-bg);color:var(--bad)}.dl.eq{background:var(--bg);color:var(--muted)}
.cnt{flex:none;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.cnt.c1{background:var(--bg);color:var(--muted)}.cnt.c2{background:#fdecc8;color:#7a4b00}.cnt.c3{background:var(--bad-bg);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cnt.c2{background:#3b2f10;color:#f2c25b}}
:root[data-theme="dark"] .cnt.c2{background:#3b2f10;color:#f2c25b}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:10px;align-self:center}
.empty{text-align:center;color:var(--muted);padding:28px 8px;display:flex;flex-direction:column;gap:6px}
.empty b{font-size:1.05rem;color:var(--fg)}

/* icons + motion */
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.btn .ic{width:1.25em;height:1.25em}
.ibtn{display:inline-flex;align-items:center;gap:4px}
.ibtn .ic{width:1.1em;height:1.1em}
.btn,.ibtn,.opt,.tile,.chip,.cell,.it>button,.seg button{position:relative;overflow:hidden;transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .18s,border-color .18s,box-shadow .18s,opacity .18s}
.btn:active:not([disabled]),.ibtn:active,.tile:active,.chip:active,.cell:active,.opt:active:not([disabled]),.seg button:active{transform:scale(.96)}
.it>button:active{background:var(--bg)}
.btn.primary{box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.primary:active:not([disabled]){box-shadow:none;transform:translateY(1px) scale(.98)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap.enter>*{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.wrap.enter>*:nth-child(2){animation-delay:.05s}.wrap.enter>*:nth-child(3){animation-delay:.1s}.wrap.enter>*:nth-child(4){animation-delay:.15s}
.wrap.enter>*:nth-child(5){animation-delay:.2s}.wrap.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt.sel .k,.opt.ok .k,.opt.bad .k{animation:pop .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes okpulse{0%{box-shadow:0 0 0 0 rgba(21,122,70,.45)}100%{box-shadow:0 0 0 12px rgba(21,122,70,0)}}
.opt.bad.fresh{animation:shake .42s}
.opt.ok.fresh{animation:okpulse .6s}
.fb.fresh{animation:enter .35s both}
.fb .ic{width:1.3em;height:1.3em;vertical-align:-.28em;margin-right:4px}
.opt .m .ic{width:1.3em;height:1.3em;stroke-width:3}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.anim .plot .b{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.anim .plot .v{animation:fadein .5s both;animation-delay:calc(var(--i)*60ms + .4s)}
.anim .tw .tr i,.anim .rec .sg i{transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.ring circle.rg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes mask{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.mask{animation:mask .2s both}
.sheet{animation:slideup .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringing{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}
.alarm .ic{width:3.2rem;height:3.2rem;color:var(--bad);animation:ringing 1.2s .2s both}
@keyframes blink{50%{opacity:.45}}
.tm.low{animation:blink 1s infinite}
.tm .ic{width:.95em;height:.95em;margin-right:3px;vertical-align:-.12em}
.hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--brand);color:var(--brand-fg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:var(--accent);opacity:.22}
.hero .hi{flex:none;width:3.4rem;height:3.4rem;border-radius:16px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;z-index:1}
.hero .hi .ic{width:1.9rem;height:1.9rem}
.hero h2{font-size:1.15rem;z-index:1}.hero p{margin:2px 0 0;font-size:.85rem;opacity:.85;z-index:1}
.tile .ti{width:2.3rem;height:2.3rem;border-radius:12px;display:grid;place-items:center;background:var(--sel-bg);color:var(--sel-line);margin-bottom:4px}
.tile .ti.w{background:var(--bad-bg);color:var(--bad)}
.tile .ti .ic{width:1.3rem;height:1.3rem}
.drop .ic{width:2.2rem;height:2.2rem;color:var(--muted)}
.hd{display:flex;align-items:center;gap:8px}
.hd .ic{width:1.3rem;height:1.3rem;color:var(--sel-line)}
.empty .ic{width:3rem;height:3rem;color:var(--muted);align-self:center}

function countUp(el){
  const txt=el.textContent,to=parseFloat(txt);if(isNaN(to))return;
  const dec=(txt.split(".")[1]||"").length,t0=performance.now(),dur=900;

        if(whole.includes(n))ok=true;

    }).join("");
  }).join("\n");
  return {html,hit,total,has:!!user};
}

function shortNeed(q,total){const m=/任意\s*(\d+)\s*条/.exec(q.stem);return m?Math.min(+m[1],total):total}

/* ---------- docx reading (zip + deflate, no libraries) ---------- */
async function readDocxText(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error("不是有效的 .docx 文件");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+el+cl;
    if(name!=="word/document.xml")continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    let data=u8.subarray(ds,ds+csize);
    if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("当前浏览器版本过低，请使用新版 Chrome / Safari / 微信内置浏览器以外的浏览器");
      const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data=new Uint8Array(await new Response(s).arrayBuffer());
    }
    return xmlToText(dec.decode(data));
  }
  throw new Error("文档中未找到正文内容");
}
function xmlToText(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const out=[];
  for(const p of doc.getElementsByTagName("w:p")){
    let t="";
    const walk=n=>{for(const c of n.childNodes){
      if(c.nodeType!==1)continue;
      const nm=c.nodeName;
      if(nm==="w:t")t+=c.textContent;
      else if(nm==="w:tab")t+=" ";
      else if(nm==="w:br"||nm==="w:cr")t+="\n";
      else if(nm==="w:rPr"||nm==="w:pPr")continue;
      else walk(c);
    }};
    walk(p);out.push(t);
  }
  return out.join("\n");
}

/* ---------- question parser ---------- */
const HEAD=/^(?:[一二三四五六七八九十]+\s*[、.．]\s*)?(单项选择|单选|多项选择|多选|选择|判断|简答|问答|填空|论述|案例分析|案例)题?/;
const QSTART=/^(\d{1,3})\s*[.、．]\s*(?=\S)/;
function secType(l){
  if(l.length>24||!/题/.test(l))return null;
  const m=l.match(HEAD);if(!m)return null;
  if(/判断/.test(m[1]))return "tf";
  if(/多/.test(m[1]))return "multi";
  if(/简答|问答|填空|论述|案例/.test(m[1]))return "short";
  return "single";
}
const TFMAP={"√":"T","✓":"T","✔":"T","对":"T","正确":"T","T":"T","×":"F","✗":"F","✘":"F","错":"F","错误":"F","F":"F","X":"F","x":"F"};
function parseBank(text){
  const lines=text.replace(/[　 ]/g," ").split("\n").map(s=>s.trim()).filter(Boolean);
  const warns=[];const bank=[];
  let type="single",prev=0,cur=null;const chunks=[];
  const flush=()=>{if(cur){chunks.push(cur);cur=null}};
  for(const l of lines){
    const st=secType(l);
    if(st){flush();type=st;prev=0;continue}
    const m=l.match(QSTART);
    if(m){const n=+m[1];
      if(n>=prev&&n<=prev+5&&(prev>0||n<=5)){flush();prev=n;cur={type,no:n,lines:[l.slice(m[0].length)]};continue}}
    // question whose number label was lost (Word auto-numbering): a stem line with an answer mark right after finished options
    if(cur&&(cur.type==="single"||cur.type==="multi")&&cur.lines.some(x=>/(^|\s)A\s*[.．、]/.test(x))&&!QSTART.test(l)&&!/^[A-F]\s*[.．、]/.test(l)&&!/(^|\s)[A-F]\s*[.．、]/.test(l)&&/[（(]\s*[A-F]+\s*[）)]/.test(l)){
      const t=cur.type;flush();prev++;cur={type:t,no:prev,lines:[l]};continue}
    if(cur)cur.lines.push(l);
  }
  flush();
  let skipped=0;
  for(const c of chunks){
    const q=c.type==="tf"?parseTF(c):c.type==="short"?parseShort(c):parseChoice(c);
    if(q){q.src=c.no;bank.push(q)}else{skipped++;warns.push(`${TYPE[c.type]}第 ${c.no} 题格式无法识别，已跳过`)}
  }
  bank.forEach((q,i)=>q.id=i);
  return {bank,warns};
}
function parseTF(c){
  let t=c.lines.join(" ").trim();
  const re=/[（(]\s*(√|✓|✔|×|✗|✘|对|错|正确|错误)\s*[）)]/g;let m,last=null;
  while((m=re.exec(t)))last=m;
  let ans=null;
  if(last){ans=TFMAP[last[1]];t=(t.slice(0,last.index)+t.slice(last.index+last[0].length)).trim()}
  if(!t)return null;
  return {type:"tf",stem:t,opts:[{k:"T",t:"正确"},{k:"F",t:"错误"}],ans};
}
function parseShort(c){
  const stem=c.lines[0];const rest=c.lines.slice(1).join("\n").replace(/^答案[:：]?\s*/,"").trim();
  return {type:"short",stem,opts:[],ans:null,ref:rest};
}
function parseChoice(c){
  const t=c.lines.join("\n").replace(/[ \t]+/g,m=>m.length>1?"  ":" ").trim();
  const firstNl=t.indexOf("\n");
  // find where option A starts (dotted, or undotted outside parentheses, or missing)
  let aStart=-1,aEnd=-1;
  const am=/(^|\s)A\s*[.．、]\s*/.exec(t);
  if(am){aStart=am.index+am[1].length;aEnd=am.index+am[0].length}
  else{
    const re=/(^|\s)A\s+(?=\S)/g;let m;
    while((m=re.exec(t))){const before=t.slice(0,m.index).trimEnd();if(/[（(]$/.test(before))continue;aStart=m.index+m[1].length;aEnd=m.index+m[0].length;break}
  }
  const marks=[];
  let from;
  const find=(L,from)=>{
    const rest=t.slice(from);
    const mm=new RegExp("\\sL\\s*[.．、:：]\\s*".replace("L",L)).exec(rest)||new RegExp("\\sL\\s+(?=\\S)".replace("L",L)).exec(rest);
    return mm?{s:from+mm.index+1,e:from+mm.index+mm[0].length}:null;
  };
  if(aStart>=0){marks.push({k:"A",s:aStart,e:aEnd});from=aEnd}
  else{
    // option label A lost (auto-numbered in Word): options start on the line after the stem
    const bm=find("B",Math.max(0,firstNl));if(!bm||firstNl<0)return null;
    marks.push({k:"A",s:firstNl+1,e:firstNl+1,lost:true});marks.push({k:"B",...bm});from=bm.e;
  }
  const LET="ABCDEF";
  for(let i=marks.length;i<6;i++){
    let L=LET[i],m=find(L,from),miss=false;
    if(!m&&i+1<6){const m2=find(LET[i+1],from);if(m2){miss=true;marks.push({k:L,s:-1,e:-1,lost:true});L=LET[i+1];m=m2;i++}}
    if(!m)break;
    marks.push({k:L,s:m.s,e:m.e});from=m.e;
  }
  if(marks.length<2)return null;
  // repair a lost middle label by splitting the previous option text at its last wide gap
  for(let i=0;i<marks.length;i++){
    if(marks[i].lost&&marks[i].s===-1){
      const p=marks[i-1],n=marks[i+1];
      const seg=t.slice(p.e,n.s).trimEnd();const g=[...seg.matchAll(/\s{2,}|\n/g)].pop();
      if(!g)return null;
      marks[i].s=p.e+g.index+g[0].length;marks[i].e=marks[i].s;marks[i].cut=p.e+g.index;
    }
  }
  const optEnd=i=>i+1<marks.length?(marks[i+1].cut??marks[i+1].s):t.length;
  const opts=marks.map((m,i)=>({k:m.k,t:t.slice(m.e,optEnd(i)).replace(/\s+/g," ").trim()}));
  if(opts.some(o=>!o.t))return null;
  let stem=t.slice(0,marks[0].lost&&marks[0].s>=0?firstNl:marks[0].s).replace(/\s+/g," ").trim();
  // answer in stem
  const re=/[（(]\s*([A-Fa-f](?:\s*[、,，]?\s*[A-Fa-f])*)\s*[）)]/g;let m;const found=[];
  while((m=re.exec(stem)))found.push(m);
  let letters=new Set();
  for(const f of found)for(const ch of f[1].toUpperCase())if(/[A-F]/.test(ch))letters.add(ch);
  if(found.length){
    const lastM=found[found.length-1];
    const blanks=(stem.match(/[（(]\s*[）)]/g)||[]).length;
    // remove answer marks
    for(const f of [...found].reverse())stem=stem.slice(0,f.index)+"（　　）"+stem.slice(f.index+f[0].length);
    if(blanks>0&&/（　　）\s*[。.]?\s*$/.test(stem))stem=stem.replace(/\s*（　　）\s*([。.]?)\s*$/,"$1");
  }
  stem=stem.replace(/[（(]\s*[）)]/g,"（　　）").trim();
  let ans=letters.size?[...letters].sort().join(""):null;
  if(!ans){const am2=/答案\s*[:：]?\s*([A-F]+)/.exec(t);if(am2)ans=am2[1]}
  const keys=opts.map(o=>o.k);
  if(ans&&![...ans].every(x=>keys.includes(x)))ans=null;
  const type=ans&&ans.length>1?"multi":(c.type==="multi"?"multi":"single");
  return {type,stem,opts,ans};
}

function stat(){
  const E=S.exam.items;let got=0,total=0,ok=0,bad=0,un=0,na=0,sh=0,shAll=0,shGot=0,shTotal=0;
  for(const x of E){
    if(x.q.type==="short"){
      shAll++;if(x.done)sh++;
      if(x.score>0){const g=shortScore(x);shTotal+=x.score;shGot+=g;total+=x.score;got+=g}
      continue;
    }
    if(!x.q.ans){na++;continue}
    total+=x.score;
    if(!x.done)un++;else if(x.ok){ok++;got+=x.score}else bad++;
  }
  got=Math.round(got*10)/10;
  return {got,total,ok,bad,un,na,sh,shAll,shGot:Math.round(shGot*10)/10,shTotal};
}

  const stl=E.map(status),nBad=stl.filter(t=>t==="bad"||t==="mid").length,nUn=stl.filter(t=>t==="un"||t==="na-un").length;

  const show=E.map((x,i)=>[x,i]).filter(([x])=>{const st=status(x);return f==="all"||(f==="bad"&&(st==="bad"||st==="mid"))||(f==="un"&&(st==="un"||st==="na-un"))});
  const label={mid:["mid","部分得分"],ok:["ok","答对"],bad:["bad","答错"],un:["na","未答"],"na-ans":["na","无答案"],"na-seen":["na","已看答案"],"na-un":["na","未看答案"]};
  const used=Math.max(1,Math.round(((S.exam.end||Date.now())-S.exam.start)/60000));
  const items=show.map(([x,i])=>{
    const st=status(x),q=x.q,open=S.open.has(i),lb=label[st];
    const earned=q.type==="short"?shortScore(x):(st==="ok"?x.score:0);
    let det="";
    if(open){
      if(q.type==="short")det=`<div class="ln"><b>你的答案</b><span>${esc(x.text)||"（未填写）"}</span></div><div class="ln"><b>参考答案</b><span style="white-space:pre-wrap">${q.ref?refCompare(q.ref,x.text).html:"题库未提供"}</span></div>`;
      else{
        det=`<ul class="o">${q.opts.map(o=>`<li class="${q.ans&&q.ans.includes(o.k)?"c":""}">${q.type==="tf"?"":o.k+". "}${esc(o.t)}${q.ans&&q.ans.includes(o.k)?"　✓":""}</li>`).join("")}</ul>
        <div class="ln"><b>你的答案</b><span>${x.sel?esc(q.type==="tf"?(x.sel==="T"?"正确":"错误"):x.sel):"未作答"}</span></div>
        <div class="ln"><b>正确答案</b><span>${q.ans?esc(q.type==="tf"?ansText(q):q.ans):"题库未提供"}</span></div>`;
      }
    }
    return `<div class="it ${open?"open":""}"><button data-open="${i}" aria-expanded="${open}"><span class="n">${i+1}</span><span class="s">${esc(q.stem)}</span><span class="st ${lb[0]}">${lb[1]}${isExam&&x.score&&st!=="un"?` ${earned>0?"+"+earned:"0"}`:""}</span></button>${open?`<div class="det">${det}</div>`:""}</div>`;
  }).join("");
  const nav=`<div class="l"></div><div class="t">${isExam?"本次模考成绩":(S.exam.label?S.exam.label+"结果":"错题练习结果")}</div><div class="r">${zBtn()}</div>`;
  const unit=isExam?"分":"题";
  const title=isExam?(s.total?(pct>=.9?"🏆 成绩优秀":pct>=.6?"👍 成绩合格":"💪 还需加强"):"本卷无可计分题"):(!s.total?"👀 已浏览完毕":s.bad+s.un===0?"🎉 全部答对":"💪 继续加油");
  if(isExam&&s.total&&pct>=.6&&S.pre)S.celebrate=true;
  const act=Object.values(wrongs()).filter(w=>w.active).length;
  const note=isExam
    ? (S.timeUp?`<div class="fb bad" role="status">${ic("clock")}时间到，已自动交卷</div>`:"")+(s.bad?`<div class="fb neutral">📒 本次 ${s.bad} 道错题已加入错题本，可以马上重练。</div>`:`<div class="fb ok">🎯 本次没有错题，继续保持！</div>`)
    : (S.exam.label?`<div class="fb neutral">这是题库练习，不计入成绩记录。</div>`:`<div class="fb neutral">答对的题已移入“已掌握”，答错的题留在错题本里。当前还有 ${act} 道待巩固。</div>`);
  const body=`${note}
    <div class="card score">
      <div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="${pct>=.6?"var(--ok)":"var(--bad)"}" stroke-width="12" stroke-linecap="round" class="rg" stroke-dasharray="${C}" data-to="${C*(1-pct)}" stroke-dashoffset="${S.pre?C:C*(1-pct)}"/></svg>
        <div class="c"><b class="cu">${+s.got.toFixed(1)}</b><span>/ ${s.total} ${unit}</span></div></div>
      <div style="min-width:0"><span class="tr ${pct>=.6||!isExam?"p":"f"}">${ic(isExam?(pct>=.6?"trophy":"target"):"check")}</span><h2>${title}</h2>
      <p class="sub">正确率 ${Math.round(pct*100)}% · 用时约 ${used} 分钟</p></div>
    </div>
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${s.ok}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${s.bad}</b><span>答错</span></div>
      <div class="stat"><b>${s.un}</b><span>未答</span></div>
      ${s.shTotal?`<div class="stat"><b>${s.shGot}<small style="font-size:.7rem;color:var(--muted)">/${s.shTotal}</small></b><span>简答得分</span></div>`:s.shAll?`<div class="stat"><b>${s.sh}/${s.shAll}</b><span>简答已看（不评分）</span></div>`:""}
    </div>
    <div class="tiles">
      <button class="tile" id="toWrong"><span class="ti w">${ic("book")}</span><b>错题本</b><small>待巩固 ${act} 题</small></button>
      <button class="tile" id="toHist"><span class="ti">${ic("chart")}</span><b>成绩记录</b><small>查看历次成绩走势</small></button></div>
    <div class="chips" role="group" aria-label="筛选">
      <button class="chip" data-f="all" aria-pressed="${f==="all"}">全部 ${E.length}</button>
      <button class="chip" data-f="bad" aria-pressed="${f==="bad"}">只看错题 ${nBad}</button>
      <button class="chip" data-f="un" aria-pressed="${f==="un"}">未答 ${nUn}</button></div>
    <div class="list">${items||`<p class="sub">这里没有题目。</p>`}</div>`;
  const foot=isExam
    ? `<button class="btn" id="toHome">${ic("home")}首页</button><button class="btn dark" id="retryWrong" ${s.bad?"":"disabled"}>${ic("target")}重练${s.bad?"("+s.bad+")":""}</button><button class="btn primary" id="again">${ic("refresh")}再来一套</button>`
    : (S.exam.label?`<button class="btn" id="toHome">${ic("home")}首页</button><button class="btn primary" id="bankAgain">${ic("refresh")}再练一遍</button>`:`<button class="btn" id="toHome">${ic("home")}首页</button><button class="btn primary" id="practiceAll" ${act?"":"disabled"}>${ic("target")}继续练错题${act?"("+act+")":""}</button>`);
  return shell(nav,body,foot);
}

/* ---------- wrong book ---------- */
function wrongList(){
  const W=wrongs();
  return Object.entries(W).map(([k,w])=>({k,...w})).filter(w=>S.wtab==="active"?w.active:!w.active)
    .sort((a,b)=>b.count-a.count||b.last-a.last);
}
function vWrong(){
  const all=Object.values(wrongs()),na=all.filter(w=>w.active).length,nm=all.length-na;
  const list=wrongList();S.wl=list.map(w=>w.k);
  const nav=`<div class="l"><button class="ibtn" id="toHome">${ic("back")}返回</button></div><div class="t">错题本</div><div class="r">${zBtn()}</div>`;
  const rows=list.map((w,i)=>{
    const q=w.q,open=S.open.has("w"+i),c=w.count>=3?"c3":w.count===2?"c2":"c1";
    let det="";
    if(open)det=`<ul class="o">${q.opts.map(o=>`<li class="${q.ans&&q.ans.includes(o.k)?"c":""}">${q.type==="tf"?"":o.k+". "}${esc(o.t)}${q.ans&&q.ans.includes(o.k)?"　✓":""}</li>`).join("")}</ul>
      <div class="ln"><b>正确答案</b><span>${esc(q.type==="tf"?ansText(q):q.ans)}</span></div>
      <div class="ln"><b>最近答错</b><span>${fmtT(w.last)}${w.masteredAt?"　· 已于 "+fmtT(w.masteredAt)+" 掌握":""}</span></div>
      <button class="linkbtn" data-del="${i}" style="align-self:flex-start;padding:4px 0">移出错题本</button>`;
    return `<div class="it ${open?"open":""}"><button data-wopen="${i}" aria-expanded="${open}"><span class="n">${i+1}</span><span class="s">${esc(q.stem)}</span><span class="cnt ${c}">错 ${w.count} 次</span></button>${open?`<div class="det">${det}</div>`:""}</div>`;
  }).join("");
  const empty=S.wtab==="active"
    ? `<div class="empty">${ic(all.length?"smile":"book")}<b>${all.length?"待巩固的错题已清空":"错题本还是空的"}</b><span>${all.length?"这些题都已掌握，下次模考继续保持。":"完成一次模考后，答错的题会自动收进来。"}</span></div>`
    : `<div class="empty">${ic("target")}<b>还没有已掌握的题</b><span>在错题练习中答对的题会移到这里。</span></div>`;
  const body=`<div class="chips" role="tablist"><button class="chip" data-wt="active" aria-pressed="${S.wtab==="active"}">待巩固 ${na}</button><button class="chip" data-wt="done" aria-pressed="${S.wtab==="done"}">已掌握 ${nm}</button></div>
    <p class="sub">按历次模考中答错的次数排序，次数越多越靠前。</p>
    <div class="list">${rows||empty}</div>
    ${all.length?`<button class="linkbtn" id="clearWrong">${ic("trash")} 清空错题本</button>`:""}`;
  return shell(nav,body,`<button class="btn primary" id="practiceAll" ${na?"":"disabled"}>${ic("target")}开始错题练习${na?"（"+na+" 题）":""}</button>`)+vConfirm();
}

/* ---------- history ---------- */
function vHist(){
  const R=records(),W=Object.values(wrongs());
  const nav=`<div class="l"><button class="ibtn" id="toHome">${ic("back")}返回</button></div><div class="t">成绩记录</div><div class="r">${zBtn()}</div>`;
  if(!R.length){
    return shell(nav,`<div class="empty">${ic("chart")}<b>还没有模考记录</b><span>完成一次模拟考试后，成绩和走势会显示在这里。</span></div>`,`<button class="btn primary" id="toSetup">${ic("play")}去组卷</button>`)+vConfirm();
  }
  const P=R.map(pct100),n=R.length;
  const avg=Math.round(P.reduce((a,b)=>a+b,0)/n),best=Math.max(...P),lastP=P[n-1];
  const diff=n>1?lastP-P[n-2]:null;
  const shown=R.slice(-8);
  const cols=shown.map((r,i)=>{const p=pct100(r),last=i===shown.length-1;
    return `<div class="col ${last?"last":""}" style="--i:${i}"><div class="v" style="bottom:${p}%">${p}</div><div class="b ${p<60?"f":""}" style="height:${p}%"></div></div>`}).join("");
  const dates=shown.map((r,i)=>`<span class="${i===shown.length-1?"last":""}">${fmtD(r.t)}</span>`).join("");
  const wl=W.filter(w=>w.count>0).sort((a,b)=>b.count-a.count||b.last-a.last).slice(0,8);
  const mx=wl.length?wl[0].count:1;
  const top=wl.map((w,i)=>`<div class="tw"><span class="rk ${i<3?"h":""}">${i+1}</span><div class="mid"><div class="tx">${esc(w.q.stem)}</div><div class="tr"><i style="width:${Math.max(6,w.count/mx*100)}%"></i></div></div><span class="ct">${w.count}次</span></div>`).join("");
  const rows=R.map((r,i)=>{
    const p=pct100(r),d=i>0?p-pct100(R[i-1]):null;
    const tot=r.n||1;
    const dl=d===null?"":`<span class="dl ${d>0?"up":d<0?"dn":"eq"}">${d>0?"↑ +"+d:d<0?"↓ "+d:"持平"}</span>`;
    return `<div class="rec"><div class="sc"><b class="${p>=60?"p":"f"}">${p}</b><span>分</span></div>
      <div class="info"><div class="dt">第 ${i+1} 次 · ${fmtT(r.t)}</div>
      <div class="sg" role="img" aria-label="答对${r.ok} 答错${r.bad} 未答${r.un}"><i style="width:${r.ok/tot*100}%;background:var(--ok)"></i><i style="width:${r.bad/tot*100}%;background:var(--bad)"></i></div>
      <div class="ds">答对 ${r.ok} · 答错 ${r.bad} · 未答 ${r.un} · 用时 ${r.used} 分钟${r.timeUp?" · 超时交卷":""}</div></div>${dl}</div>`;
  }).reverse().join("");
  const body=`
    <div class="stats">
      <div class="stat"><b class="cu">${n}</b><span>模考次数</span></div>
      <div class="stat"><b class="cu">${avg}</b><span>平均分</span></div>
      <div class="stat"><b class="cu" style="color:var(--ok)">${best}</b><span>最高分</span></div>
      <div class="stat"><b>${lastP}${diff!==null?`<small style="font-size:.7rem;margin-left:4px;color:var(${diff>=0?"--ok":"--bad"})">${diff>0?"↑"+diff:diff<0?"↓"+(-diff):"="}</small>`:""}</b><span>最近一次</span></div>
    </div>
    <div class="card"><h2 class="hd">${ic("chart")}每次模考成绩</h2><p class="sub">按满分 100 折算${n>8?"，仅显示最近 8 次":""}</p>
      <div class="plot" role="img" aria-label="历次模考成绩柱状图"><div class="g" style="bottom:100%"></div><div class="g" style="bottom:50%"></div><div class="pass" style="bottom:60%"></div>${cols}</div>
      <div class="dates">${dates}</div>
      <div class="lg"><span><i style="background:var(--brand)"></i>及格</span><span><i style="background:var(--bad)"></i>不及格</span><span><i style="background:transparent;border-top:2px dashed var(--accent);height:0;width:1rem;border-radius:0"></i>及格线 60 分</span></div></div>
    ${wl.length?`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div><h2 class="hd">${ic("alert")}最容易错的题</h2><p class="sub">历次模考中答错次数最多的题目</p></div>${top}</div>`:""}
    <div class="card"><h2 class="hd" style="margin-bottom:10px">${ic("list")}全部记录</h2>${rows}</div>
    <button class="linkbtn" id="clearRec">${ic("trash")} 清空成绩记录</button>`;
  return shell(nav,body,`<button class="btn primary" id="toSetup">${ic("refresh")}再来一套</button>`)+vConfirm();
}
function vConfirm(){
  if(!S.confirm)return "";
  const m=S.confirm.startsWith("del:")?["删除这套题库？","删除后无法恢复。错题本和成绩记录不受影响。"]:{rec:["清空成绩记录？","所有模考成绩将被删除，无法恢复。"],wrong:["清空错题本？","待巩固和已掌握的错题都会被删除，无法恢复。"]}[S.confirm];
  return `<div class="mask"><div class="sheet gut" role="dialog"><h2>${m[0]}</h2><p class="sub">${m[1]}</p><button class="btn block" id="cfmNo">取消</button><button class="btn dark block" id="cfmYes">${ic("trash")}确认${S.confirm.startsWith("del:")?"删除":"清空"}</button></div></div>`;
}

/* ---------- events ---------- */
function bind(){
  const on=(s,fn)=>{const e=$(s);if(e)e.addEventListener("click",fn)};
  const drop=$("#drop");
  if(drop){
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
  }
  on("#zbtn",()=>{S.z=(S.z+1)%3;applyZ();try{localStorage.setItem("anquiz.z",S.z)}catch(e){}render()});
  on("#toSetup",()=>{S.cfg=S.cfg||defaults();S.view="setup";S.resetScroll=true;render()});
  on("#toWrong",()=>{S.view="wrong";S.open=new Set();S.resetScroll=true;render()});
  on("#toHist",()=>{S.view="hist";S.resetScroll=true;render()});
  on("#resumeGo",()=>{const r=S.resume;S.resume=null;S.exam={items:r.items,start:r.start,mode:"exam",dur:r.dur,deadline:r.deadline,warned:r.warned};
    S.idx=Math.min(r.idx||0,r.items.length-1);S.sheet=false;S.quit=false;S.alert10=false;S.timeUp=false;S.seen=new Set([S.idx]);S.view="quiz";S.resetScroll=true;
    clearInterval(S.tick);S.tick=setInterval(tick,1000);render()});
  on("#resumeDrop",()=>{S.resume=null;jdel(LSE);render()});
  document.querySelectorAll("[data-bank]").forEach(b=>b.addEventListener("click",()=>startBank(b.dataset.bank)));
  on("#bankAgain",()=>startBank(S.exam.bankType));
  on("#alertOk",()=>{S.alert10=false;render()});
  on("#practiceAll",()=>{const l=Object.values(wrongs()).filter(w=>w.active).map(w=>w.q);if(l.length)buildPractice(l)});
  on("#retryWrong",()=>{const l=S.exam.items.filter(x=>x.done&&x.ok===false&&x.q.type!=="short").map(x=>x.q);if(l.length)buildPractice(l)});
  document.querySelectorAll("[data-wt]").forEach(b=>b.addEventListener("click",()=>{S.wtab=b.dataset.wt;S.open=new Set();render()}));

  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{const k=S.wl[+b.dataset.del];const W=wrongs();delete W[k];jset(LSW,W);S.open=new Set();render()}));
  on("#clearRec",()=>{S.confirm="rec";render()});on("#clearWrong",()=>{S.confirm="wrong";render()});
  on("#cfmNo",()=>{S.confirm="";render()});

    if(S.confirm==="rec")jdel(LSR);else if(S.confirm==="wrong")jdel(LSW);
    else if(S.confirm.startsWith("del:")){const id=S.confirm.slice(4);saveUserLib(jget(LSL,[]).filter(b=>b.id!==id));if(S.active.includes(id))applyActive(S.active.filter(x=>x!==id))}
    S.confirm="";render()});
  const dur=$("#dur");if(dur)dur.addEventListener("change",()=>{S.cfg.dur=Math.max(1,Math.min(300,Math.floor(+dur.value||60)));render()});
  on("#dopen",openDrawer);on("#dopen2",openDrawer);on("#dclose",closeDrawer);on("#dmask",closeDrawer);

  document.querySelectorAll("[data-bsel]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.bsel;let a=S.active.slice();

    applyActive(a);render()}));
  document.querySelectorAll("[data-bcat]").forEach(b=>b.addEventListener("click",()=>{
    const L=jget(LSL,[]),x=L.find(y=>y.id===b.dataset.bcat);if(x){x.cat=x.cat==="安全考试"?"其他":"安全考试";saveUserLib(L);applyActive(S.active)}render()}));
  document.querySelectorAll("[data-bdel]").forEach(b=>b.addEventListener("click",()=>{S.confirm="del:"+b.dataset.bdel;S.drawer=false;render()}));

  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.cfg.mode=b.dataset.mode;render()}));

  on("#confirm",()=>finishItem(S.exam.items[S.idx]));
  on("#reveal",()=>{const it=S.exam.items[S.idx];it.done=true;bumpDaily();render();const r=document.querySelector(".ref,.fb.neutral");if(r)r.scrollIntoView({block:"nearest",behavior:"smooth"})});
  const ta=$("#mytext");if(ta)ta.addEventListener("input",()=>{S.exam.items[S.idx].text=ta.value});
  on("#prev",()=>go(S.idx-1));on("#next",()=>go(S.idx+1));
  on("#finish",()=>{S.sheet=true;render()});
  on("#sheetBtn",()=>{clearTimeout(S.timer);S.sheet=true;render()});
  on("#closeSheet",()=>{S.sheet=false;render()});
  const mask=$("#mask");if(mask)mask.addEventListener("click",e=>{if(e.target===mask){S.sheet=false;render()}});
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
  on("#submit",submit);
  on("#quit",()=>{clearTimeout(S.timer);S.quit=true;render();});
  on("#quitCancel",()=>{S.quit=false;render()});
  on("#quitSubmit",()=>{S.quit=false;submit()});
  on("#quitGo",giveUp);
  // result
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.f;render()}));
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.open;S.open.has(i)?S.open.delete(i):S.open.add(i);render()}));
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||S.sheet||/TEXTAREA|INPUT/.test(e.target.tagName))return;
  if(e.key==="ArrowRight")go(S.idx+1);else if(e.key==="ArrowLeft")go(S.idx-1);
  else{const k=e.key.toUpperCase();const it=S.exam.items[S.idx];
    if(it.q.type==="tf"){if(k==="1"||k==="Y")choose("T");if(k==="2"||k==="N")choose("F")}
    else if(it.q.opts.some(o=>o.k===k))choose(k);
    else if(e.key==="Enter"&&it.q.type==="multi"&&it.sel&&!it.done)finishItem(it)}
});
$("#gfile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)loadFile(f)});
(function init(){
  migrateLegacy();
  applyActive(jget(LSA,[]));
  const sv=jget(LSE,null);
  if(sv&&Array.isArray(sv.items)&&sv.items.length){
    if(sv.deadline<=Date.now()){S.exam={items:sv.items,start:sv.start,mode:"exam",dur:sv.dur,deadline:sv.deadline,warned:true};S.timeUp=true;submit();return}
    S.resume=sv;
  }
  render();
})();
